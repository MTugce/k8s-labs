apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-summary-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cluster-summary.json: |-
    {
      "uid": "cluster-summary",
      "title": "Küme ve Sistem Özeti",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "Çalışan Toplam Pod Sayısı",
          "type": "stat",
          "targets": [{"expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "legendFormat": "Podlar", "refId": "A"}],
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "title": "Hazır Node Sayısı",
          "type": "stat",
          "targets": [{"expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "legendFormat": "Node", "refId": "A"}],
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0}
        },
        {
          "id": 3,
          "title": "Aktif Uyarılar (Firing Alerts)",
          "type": "stat",
          "targets": [{"expr": "sum(ALERTS{alertstate=\"firing\"}) or vector(0)", "legendFormat": "Alerts", "refId": "A"}],
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0}
        },
        {
          "id": 4,
          "title": "Restart Eden Konteynerler (Son 1 Saat)",
          "type": "stat",
          "targets": [{"expr": "sum(changes(kube_pod_container_status_restarts_total[1h])) or vector(0)", "legendFormat": "Restart", "refId": "A"}],
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 0}
        },
        {
          "id": 5,
          "title": "Node Bazlı CPU Kullanımı (%)",
          "type": "timeseries",
          "targets": [{"expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[1m])) * 100)", "legendFormat": "{{instance}}", "refId": "A"}],
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 6}
        },
        {
          "id": 6,
          "title": "Namespace Bazlı Bellek Tüketimi (MB)",
          "type": "timeseries",
          "targets": [{"expr": "sum by (namespace) (container_memory_working_set_bytes) / 1024 / 1024", "legendFormat": "{{namespace}}", "refId": "A"}],
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 6}
        }
      ]
    }
