# Gateway API cutover: 19001 -> Kind control-plane :80 eşlemesi kullanılır.
deployment:
  kind: Deployment
  replicas: 1
# hostNetwork kapalıdır: VM'nin 80/443 portları host Nginx'te kalır.
hostNetwork: false
nodeSelector:
  ingress-ready: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
service:
  enabled: false
ingressClass:
  enabled: false
providers:
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
gateway:
  enabled: false
gatewayClass:
  enabled: true
ports:
  web:
    port: 80
    exposedPort: 80
    hostPort: 80
