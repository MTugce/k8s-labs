apiVersion: v1
kind: Namespace
metadata:
  name: nfs-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: nfs-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      labels:
        app: nfs-server
    spec:
      containers:
        - name: nfs
          image: itsthenetwork/nfs-server-alpine:12
          securityContext:
            privileged: true
          env:
            - name: SHARED_DIRECTORY
              value: /nfsshare
          ports:
            - containerPort: 2049
          volumeMounts:
            - name: nfs-share
              mountPath: /nfsshare
      volumes:
        - name: nfs-share
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: nfs-lab
spec:
  selector:
    app: nfs-server
  ports:
    - port: 2049
      targetPort: 2049
