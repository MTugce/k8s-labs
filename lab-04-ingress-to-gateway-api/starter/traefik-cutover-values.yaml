# Gateway API cutover: mevcut 19001 -> Kind :80 eşlemesi kullanılır.
deployment:
  kind: DaemonSet
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet
tolerations:
  - operator: Exists
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 2
    maxSurge: null
service:
  enabled: false
ingressClass:
  enabled: false
providers:
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
gateway:
  enabled: false
gatewayClass:
  enabled: true
ports:
  web:
    port: 80
    exposedPort: 80
