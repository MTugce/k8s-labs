apiVersion: v1
kind: Pod
metadata:
  name: sidecar-container-pod
  labels:
    app: sidecar-demo
spec:
  containers:
    - name: web-app
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: log-volume
          mountPath: /var/log/nginx
    - name: log-sidecar
      image: busybox:1.37
      command: ['sh', '-c', 'touch /var/log/nginx/access.log && tail -F /var/log/nginx/access.log']
      volumeMounts:
        - name: log-volume
          mountPath: /var/log/nginx
  volumes:
    - name: log-volume
      emptyDir: {}
