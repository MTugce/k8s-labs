apiVersion: v1
kind: Pod
metadata:
  name: init-container-pod
  labels:
    app: init-demo
spec:
  initContainers:
    - name: setup-page
      image: busybox:1.37
      command: ['sh', '-c', 'echo "<h1>Init Container Tarafindan Hazirlandi</h1>" > /workdir/index.html']
      volumeMounts:
        - name: shared-data
          mountPath: /workdir
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
  volumes:
    - name: shared-data
      emptyDir: {}
