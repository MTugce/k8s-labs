apiVersion: v1
kind: Pod
metadata:
  name: storage-pod-1
  labels:
    app: persistent-test
spec:
  containers:
    - name: app
      image: alpine:3.21
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: app-data-pvc
