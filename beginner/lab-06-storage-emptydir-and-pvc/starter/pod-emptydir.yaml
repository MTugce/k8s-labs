apiVersion: v1
kind: Pod
metadata:
  name: shared-volume-pod
  labels:
    app: shared-volume
spec:
  containers:
    - name: reader-web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-html
          mountPath: /usr/share/nginx/html
          readOnly: true
    - name: writer-agent
      image: alpine:3.21
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "<h1>Guncel Zaman: $(date)</h1>" > /html/index.html;
            sleep 2;
          done
      volumeMounts:
        - name: shared-html
          mountPath: /html
  volumes:
    - name: shared-html
      emptyDir: {}
