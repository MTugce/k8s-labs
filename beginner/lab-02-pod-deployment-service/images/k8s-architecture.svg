<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Kubernetes Küme Mimarisi</title>
  <desc id="desc">Admin, control plane bileşenleri ve iki worker node arasındaki Kubernetes küme iletişimi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef7ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#143456" flood-opacity=".14"/></filter>
    <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#167cc0"/></marker>
    <marker id="greenArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#16856d"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" fill="#0b1f4d">Kubernetes Küme Mimarisi</text>
  <text x="600" y="82" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#55708f">Control Plane küme durumunu yönetir, Worker Node'lar uygulama Pod'larını çalıştırır</text>

  <rect x="52" y="118" width="210" height="123" rx="22" fill="white" stroke="#bfd4e8" filter="url(#shadow)"/>
  <circle cx="103" cy="169" r="28" fill="#0b63b6"/>
  <circle cx="103" cy="158" r="8" fill="white"/><path d="M87 184c2-13 30-13 32 0" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <text x="145" y="161" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#17324d">ADMIN</text>
  <text x="145" y="188" font-family="ui-monospace,Consolas,monospace" font-size="15" fill="#55708f">kubectl</text>
  <rect x="82" y="205" width="150" height="24" rx="12" fill="#e5f1fb"/><text x="157" y="222" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#0b63b6">HTTPS / TLS</text>
