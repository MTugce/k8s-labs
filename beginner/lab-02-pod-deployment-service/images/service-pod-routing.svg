<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Service ve Pod Ağ Yönlendirmesi</title>
  <desc id="desc">İstemci isteğinin ClusterIP Service ve EndpointSlice üzerinden üç Pod'a round-robin dağıtılması.</desc>
