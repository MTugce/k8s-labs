apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-app-operations-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  devops-app-operations.json: |-
    {
      "uid": "devops-app-operations",
      "title": "Devops App Operations",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {"id": 1, "title": "İstek hızı", "type": "timeseries", "targets": [{"expr": "sum(rate(devops_app_http_requests_total[1m]))", "legendFormat": "requests/sec", "refId": "A"}], "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}},
        {"id": 2, "title": "p95 /work süresi", "type": "timeseries", "targets": [{"expr": "histogram_quantile(0.95, sum(rate(devops_app_http_request_duration_seconds_bucket{route=\"/work\"}[1m])) by (le))", "legendFormat": "seconds", "refId": "A"}], "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}},
        {"id": 3, "title": "HPA replica sayısı", "type": "timeseries", "targets": [{"expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"private-app\",horizontalpodautoscaler=\"devops-app\"}", "legendFormat": "current", "refId": "A"}, {"expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"private-app\",horizontalpodautoscaler=\"devops-app\"}", "legendFormat": "max", "refId": "B"}], "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}},
        {"id": 4, "title": "Prometheus hedef durumu", "type": "stat", "targets": [{"expr": "up{namespace=\"private-app\",service=\"devops-app\"}", "legendFormat": "up", "refId": "A"}], "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}}
      ]
    }
