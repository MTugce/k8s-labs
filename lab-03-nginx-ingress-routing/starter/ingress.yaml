apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-app
  namespace: private-app
spec:
  ingressClassName: nginx
  rules:
    - host: __APP_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-app
                port:
                  number: 80
