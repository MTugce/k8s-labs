apiVersion: v1
kind: Namespace
metadata:
  name: private-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-app-config
  namespace: private-app
data:
  default.conf: |
    server {
        listen 80;
        default_type application/json;

        location /healthz {
            return 200 '{"status": "UP", "application": "devops-app"}\n';
        }

        location / {
            return 200 '{"status": "UP", "application": "devops-app"}\n';
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  namespace: private-app
  labels:
    app: devops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
        - name: devops-app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: config-volume
          configMap:
            name: devops-app-config
---
apiVersion: v1
kind: Service
metadata:
  name: devops-app
  namespace: private-app
  labels:
    app: devops-app
spec:
  type: ClusterIP
  selector:
    app: devops-app
  ports:
    - name: http
      port: 80
      targetPort: 80
