apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
  namespace: first-app
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30086
---
apiVersion: v1
kind: Service
metadata:
  name: external-docs
  namespace: first-app
spec:
  type: ExternalName
  externalName: kubernetes.io
---
apiVersion: v1
kind: Service
metadata:
  name: web-loadbalancer
  namespace: first-app
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
