apiVersion: apps/v1
kind: Deployment
metadata: { name: devops-app-rolling, namespace: private-app }
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: devops-app-rolling } }
  template:
    metadata: { labels: { app: devops-app-rolling } }
    spec:
      containers: [{ name: app, image: __IMAGE_V1__, ports: [{ containerPort: 8080 }] }]
---
apiVersion: v1
kind: Service
metadata: { name: strategy-rolling, namespace: private-app }
spec: { selector: { app: devops-app-rolling }, ports: [{ port: 80, targetPort: 8080 }] }
