apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-app-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  devops-app-lab.json: |-
    {
      "uid": "devops-app-lab",
      "title": "Devops App Lab",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "HTTP istek hızı",
          "type": "timeseries",
          "targets": [{"expr": "sum(rate(devops_app_http_requests_total[1m]))", "legendFormat": "requests/sec", "refId": "A"}],
          "gridPos": {"h": 9, "w": 12, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "title": "p95 /work istek süresi",
          "type": "timeseries",
          "targets": [{"expr": "histogram_quantile(0.95, sum(rate(devops_app_http_request_duration_seconds_bucket{route=\"/work\"}[1m])) by (le))", "legendFormat": "seconds", "refId": "A"}],
          "gridPos": {"h": 9, "w": 12, "x": 12, "y": 0}
        }
      ]
    }
