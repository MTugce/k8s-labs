apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: devops-app-gateway }
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes: { namespaces: { from: Same } }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: devops-app-route }
spec:
  parentRefs: [{ name: devops-app-gateway }]
  hostnames: [__APP_HOST__]
  rules:
    - backendRefs: [{ name: devops-app, port: 80 }]
