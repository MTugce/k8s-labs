# LAB 5 preview: yalnızca ayrılmış NodePort 30088 kullanılır.
ingressClass:
  enabled: false
providers:
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
gateway:
  enabled: false
gatewayClass:
  enabled: true
ports:
  web:
    port: 80
    exposedPort: 80
    nodePort: 30088
    expose:
      default: true
service:
  type: NodePort
